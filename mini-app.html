<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>OUROBORO21 · Miner</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: radial-gradient(circle at 50% 20%, #1a1200 0%, #000 70%);
    color: #f5d76e;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px;
    overflow-x: hidden;
  }
  header { text-align: center; margin-bottom: 8px; }
  header h1 {
    font-size: 20px;
    letter-spacing: 3px;
    background: linear-gradient(180deg, #fff2b0, #d4a017, #8b6914);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 900;
  }
  header p { font-size: 9px; color: #a08030; letter-spacing: 1px; margin-top: 2px; }
  .user-info {
    font-size: 10px;
    color: #a08030;
    background: rgba(245, 215, 110, 0.08);
    border: 1px solid #3a2a08;
    border-radius: 20px;
    padding: 4px 12px;
    margin-bottom: 8px;
    letter-spacing: 1px;
  }
  .panel-saldos {
    width: 100%;
    max-width: 400px;
    background: linear-gradient(135deg, rgba(245,215,110,0.06), rgba(245,215,110,0.02));
    border: 1px solid #3a2a08;
    border-radius: 12px;
    padding: 10px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .saldos-lista { display: flex; flex-direction: column; gap: 3px; flex: 1; }
  .saldo-fila { display: flex; justify-content: space-between; font-size: 10px; }
  .saldo-label { color: #a08030; }
  .saldo-valor { color: #f5d76e; font-weight: bold; }
  .saldo-valor.destacado { color: #fff2b0; }
  .saldo-valor.multi { color: #4fb8e8; text-shadow: 0 0 8px rgba(79,184,232,0.6); }
  .btn-retirar {
    padding: 10px 14px;
    font-size: 10px;
    font-weight: bold;
    letter-spacing: 1px;
    color: #1a1200;
    background: linear-gradient(180deg, #fff2b0, #d4a017);
    border: none;
    border-radius: 10px;
    cursor: pointer;
    box-shadow: 0 3px 10px rgba(245, 215, 110, 0.4);
    white-space: nowrap;
  }
  .btn-retirar:active { transform: scale(0.95); }
  .moneda-wrapper {
    position: relative;
    width: 180px;
    height: 180px;
    margin-bottom: 5px;
  }
  .anillo-progreso {
    position: absolute;
    top: 0; left: 0;
    width: 180px;
    height: 180px;
    transform: rotate(-90deg);
    pointer-events: none;
    z-index: 3;
  }
  .anillo-fondo {
    fill: none;
    stroke: #2a1e05;
    stroke-width: 5;
  }
  .anillo-fill {
    fill: none;
    stroke: url(#gradienteAnillo);
    stroke-width: 5;
    stroke-linecap: round;
    transition: stroke-dashoffset 1.5s ease-in-out;
    filter: drop-shadow(0 0 8px rgba(245, 215, 110, 0.9));
  }
  .moneda-img {
    position: absolute;
    top: 15px; left: 15px;
    width: 150px;
    height: 150px;
    object-fit: contain;
    filter: drop-shadow(0 0 25px rgba(245, 215, 110, 0.6));
    animation: girar 4s linear infinite;
    z-index: 1;
    border-radius: 50%;
  }
  @keyframes girar {
    0%   { transform: rotateY(0deg); }
    100% { transform: rotateY(360deg); }
  }
  .moneda-progreso {
    font-size: 10px;
    color: #a08030;
    letter-spacing: 1px;
    margin-bottom: 10px;
    text-align: center;
  }
  .moneda-progreso strong {
    color: #fff2b0;
    font-size: 13px;
  }
  .pozo {
    width: 100%;
    max-width: 400px;
    background: #0a0603;
    border-radius: 12px;
    border: 1px solid #3a2a08;
    padding: 8px;
    margin-bottom: 10px;
    position: relative;
    overflow: hidden;
    min-height: 60px;
  }
  .fase {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 12px;
    margin-bottom: 6px;
    border-radius: 10px;
    border: 2px solid;
    position: relative;
    transition: all 0.6s ease-in-out;
    overflow: hidden;
  }
  .fase:last-child { margin-bottom: 0; }
  .fase[data-fase="0"] { border-color: #3fc973; background: linear-gradient(135deg, rgba(63,201,115,0.25), rgba(63,201,115,0.08)); box-shadow: 0 0 20px rgba(63,201,115,0.2); }
  .fase[data-fase="1"] { border-color: #4fb8e8; background: linear-gradient(135deg, rgba(79,184,232,0.25), rgba(79,184,232,0.08)); box-shadow: 0 0 20px rgba(79,184,232,0.2); }
  .fase[data-fase="2"] { border-color: #f5a623; background: linear-gradient(135deg, rgba(245,166,35,0.25), rgba(245,166,35,0.08)); box-shadow: 0 0 20px rgba(245,166,35,0.2); }
  .fase[data-fase="3"] { border-color: #ff5c5c; background: linear-gradient(135deg, rgba(255,92,92,0.25), rgba(255,92,92,0.08)); box-shadow: 0 0 20px rgba(255,92,92,0.2); }
  .fase[data-fase="4"] { border-color: #b667ff; background: linear-gradient(135deg, rgba(182,103,255,0.25), rgba(182,103,255,0.08)); box-shadow: 0 0 20px rgba(182,103,255,0.2); }
  .fase[data-fase="5"] { border-color: #ffd966; background: linear-gradient(135deg, rgba(255,217,102,0.3), rgba(255,217,102,0.1)); box-shadow: 0 0 30px rgba(255,217,102,0.3); }
  .fase.activa { transform: scale(1.03); animation: pulsoFase 2s infinite ease-in-out; }
  @keyframes pulsoFase {
    0%, 100% { box-shadow: 0 0 20px rgba(255, 179, 71, 0.3); }
    50%      { box-shadow: 0 0 35px rgba(255, 217, 102, 0.5); }
  }
  .fase.completada {
    opacity: 0;
    max-height: 0;
    padding-top: 0;
    padding-bottom: 0;
    margin-bottom: 0;
    border-width: 0;
    transform: translateX(-100%);
    pointer-events: none;
  }
  .fase-izq { text-align: left; flex: 1; }
  .fase-nombre { font-size: 11px; font-weight: bold; color: #fff2b0; letter-spacing: 1px; text-shadow: 0 0 8px rgba(255,255,255,0.3); }
  .fase-reward { font-size: 12px; font-weight: bold; color: #fff2b0; margin-top: 2px; }
  .fase-contador { font-size: 9px; color: #e0c890; margin-top: 2px; }
  .fase.activa .fase-contador { color: #fff2b0; font-weight: bold; }
  .fase-barra { width: 100%; height: 4px; background: rgba(0,0,0,0.4); border-radius: 10px; overflow: hidden; margin-top: 4px; }
  .fase-barra-fill { height: 100%; background: linear-gradient(90deg, #fff2b0, #ffd966); transition: width 0.6s; box-shadow: 0 0 10px rgba(255, 242, 176, 0.8); }
  .fase-badge { font-size: 8px; font-weight: bold; padding: 4px 8px; border-radius: 20px; background: rgba(0,0,0,0.5); color: #fff2b0; border: 1px solid rgba(255,242,176,0.4); white-space: nowrap; margin-left: 6px; }
  .fase.activa .fase-badge { background: #fff2b0; color: #1a1200; border-color: #fff2b0; box-shadow: 0 0 15px rgba(255,242,176,0.7); }
  .minero {
    position: absolute;
    right: 15px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 26px;
    animation: picar 0.6s infinite alternate;
    pointer-events: none;
    filter: drop-shadow(0 0 10px rgba(245, 215, 110, 0.9));
  }
  @keyframes picar {
    0%   { transform: translateY(-50%) rotate(-15deg); }
    100% { transform: translateY(-50%) rotate(15deg); }
  }
  .fase6-infinito {
    text-align: center;
    padding: 30px 15px;
    background: linear-gradient(135deg, rgba(255,217,102,0.15), rgba(255,217,102,0.05));
    border: 2px solid #ffd966;
    border-radius: 14px;
    box-shadow: 0 0 40px rgba(255,217,102,0.4);
    animation: pulsoInfinito 3s infinite ease-in-out;
    position: relative;
    overflow: hidden;
  }
  @keyframes pulsoInfinito {
    0%, 100% { box-shadow: 0 0 30px rgba(255,217,102,0.3); }
    50%      { box-shadow: 0 0 60px rgba(255,217,102,0.7); }
  }
  .infinito-simbolo {
    font-size: 64px;
    font-weight: bold;
    color: #fff2b0;
    text-shadow: 0 0 20px #ffd966, 0 0 40px #f5b342;
    animation: latido 1.5s infinite ease-in-out;
    display: inline-block;
  }
  @keyframes latido {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.15); }
  }
  .infinito-texto { font-size: 11px; color: #fff2b0; letter-spacing: 3px; margin-top: 8px; text-shadow: 0 0 8px rgba(255,217,102,0.7); }
  .infinito-contador { font-size: 12px; color: #e0c890; margin-top: 4px; }
  .infinito-minero {
    font-size: 28px;
    margin-top: 12px;
    animation: picar2 0.6s infinite alternate;
    display: inline-block;
    filter: drop-shadow(0 0 10px rgba(245, 215, 110, 0.9));
  }
  @keyframes picar2 {
    0%   { transform: rotate(-15deg); }
    100% { transform: rotate(15deg); }
  }
  .minar-section {
    width: 100%;
    max-width: 400px;
    background: linear-gradient(135deg, rgba(245,215,110,0.08), rgba(245,215,110,0.02));
    border: 1px solid #4a3510;
    border-radius: 12px;
    padding: 12px;
    text-align: center;
    margin-bottom: 10px;
  }
  .timer {
    font-size: 24px;
    font-weight: bold;
    color: #f5d76e;
    text-shadow: 0 0 12px rgba(245, 215, 110, 0.7);
    letter-spacing: 2px;
    margin-bottom: 3px;
  }
  .timer-label { font-size: 9px; color: #a08030; letter-spacing: 1px; margin-bottom: 8px; }
  .barra-minar {
    width: 100%;
    height: 6px;
    background: #221a05;
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 10px;
  }
  .barra-minar-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #8b6914, #f5d76e, #fff2b0);
    transition: width 1s linear;
    box-shadow: 0 0 10px rgba(245, 215, 110, 0.8);
  }
  .btn-minar {
    width: 100%;
    padding: 14px;
    font-size: 15px;
    font-weight: bold;
    letter-spacing: 2px;
    color: #1a1200;
    background: linear-gradient(180deg, #fff2b0, #d4a017);
    border: none;
    border-radius: 40px;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(245, 215, 110, 0.5);
    transition: transform 0.15s;
  }
  .btn-minar:active { transform: scale(0.96); }
  .btn-minar:disabled { background: #3a2a08; color: #6a5020; box-shadow: none; cursor: not-allowed; }
  footer { margin-top: 8px; font-size: 9px; color: #6a5020; letter-spacing: 1px; }
  .modal {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.9);
    display: none;
    justify-content: center;
    align-items: center;
    padding: 15px;
    z-index: 1000;
    overflow-y: auto;
  }
  .modal.active { display: flex; }
  .modal-content {
    background: linear-gradient(180deg, #1a1200, #0a0800);
    border: 1px solid #4a3510;
    border-radius: 20px;
    padding: 20px 15px;
    max-width: 380px;
    width: 100%;
    text-align: center;
    box-shadow: 0 0 40px rgba(245, 215, 110, 0.3);
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal-content h2 { color: #f5d76e; font-size: 17px; margin-bottom: 12px; letter-spacing: 2px; }
  .modal-content p { color: #c9a94a; font-size: 14px; line-height: 1.5; margin-bottom: 20px; white-space: pre-line; }
  .modal-content button.btn-cerrar {
    padding: 12px 35px;
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 2px;
    color: #1a1200;
    background: linear-gradient(180deg, #fff2b0, #d4a017);
    border: none;
    border-radius: 50px;
    cursor: pointer;
  }
  .loading {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid #1a1200;
    border-top: 2px solid transparent;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-left: 8px;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

  <header>
    <h1>OUROBORO21</h1>
    <p>El ciclo eterno del valor en la red TON</p>
  </header>

  <div class="user-info" id="userInfo">Cargando usuario...</div>

  <div class="panel-saldos">
    <div class="saldos-lista">
      <div class="saldo-fila">
        <span class="saldo-label">Total:</span>
        <span class="saldo-valor" id="saldoTotal">— ORO21</span>
      </div>
      <div class="saldo-fila">
        <span class="saldo-label">Retirado:</span>
        <span class="saldo-valor" id="saldoRetirado">— ORO21</span>
      </div>
      <div class="saldo-fila">
        <span class="saldo-label">Disponible:</span>
        <span class="saldo-valor destacado" id="saldoDisponible">— ORO21</span>
      </div>
      <div class="saldo-fila">
        <span class="saldo-label">Multiplicador:</span>
        <span class="saldo-valor multi" id="saldoMulti">1x</span>
      </div>
    </div>
    <button class="btn-retirar" onclick="solicitarRetiro()">💸<br>RETIRAR</button>
  </div>

  <div class="moneda-wrapper">
    <img class="moneda-img" src="logo.png" alt="ORO21" onerror="this.style.background='radial-gradient(circle, #f5d76e 0%, #d4a017 40%, #8b6914 100%)'; this.alt=''; this.src='';">
    <svg class="anillo-progreso" viewBox="0 0 180 180">
      <defs>
        <linearGradient id="gradienteAnillo" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#8b6914"/>
          <stop offset="50%" stop-color="#f5d76e"/>
          <stop offset="100%" stop-color="#fff2b0"/>
        </linearGradient>
      </defs>
      <circle class="anillo-fondo" cx="90" cy="90" r="85"/>
      <circle class="anillo-fill" id="anilloFill" cx="90" cy="90" r="85"
              stroke-dasharray="534"
              stroke-dashoffset="534"/>
    </svg>
  </div>
  <div class="moneda-progreso">
    Comunidad: <strong id="progresoTexto">0%</strong>
  </div>

  <div class="pozo" id="pozo"></div>

  <div class="minar-section">
    <div class="timer" id="timer">--:--:--</div>
    <div class="timer-label" id="timerLabel">Cargando estado...</div>
    <div class="barra-minar">
      <div class="barra-minar-fill" id="barraMinar"></div>
    </div>
    <button class="btn-minar" id="btnMinar" disabled>⛏️ MINAR</button>
  </div>

  <footer>
    $ORO21 · TON · 21.000.000 suministro fijo
  </footer>

  <div class="modal" id="modal">
    <div class="modal-content">
      <h2 id="modalTitle">Resultado</h2>
      <p id="modalText">Cargando...</p>
      <button class="btn-cerrar" onclick="cerrarModal()">CERRAR</button>
    </div>
  </div>

<script>
  const WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbyrUJew9icKC6uMr7OezJj1fdve79hIM6WzC9HPcSjlmdEfEodvxVUEUsLUfszZE8Rofg/exec";

  const FASES = [
    { nombre: 'FASE 1', reward: 100, from: 1,     to: 500,   cap: 500    },
    { nombre: 'FASE 2', reward: 75,  from: 501,   to: 1500,  cap: 1000   },
    { nombre: 'FASE 3', reward: 50,  from: 1501,  to: 3500,  cap: 2000   },
    { nombre: 'FASE 4', reward: 30,  from: 3501,  to: 8500,  cap: 5000   },
    { nombre: 'FASE 5', reward: 20,  from: 8501,  to: 18500, cap: 10000  },
    { nombre: 'FASE 6', reward: 10,  from: 18501, to: null,  cap: null   }
  ];

  const tg = window.Telegram?.WebApp;
  let usuarioActual = null;
  let USUARIOS = 0;
  let faseInfo = null;

  if (tg) {
    tg.ready();
    tg.expand();
    const user = tg.initDataUnsafe?.user;
    if (user) {
      usuarioActual = {
        id: user.id,
        username: user.username || '',
        nombre: (user.first_name || '') + ' ' + (user.last_name || '')
      };
      document.getElementById('userInfo').textContent =
        '👤 ' + (usuarioActual.username ? '@' + usuarioActual.username : usuarioActual.nombre.trim());
    } else {
      document.getElementById('userInfo').textContent = '⚠️ Abre desde Telegram';
    }
  } else {
    usuarioActual = { id: 123456789, username: 'prueba', nombre: 'Usuario Prueba' };
    document.getElementById('userInfo').textContent = '🧪 Modo prueba (navegador)';
  }

  let totalSeconds = 0;
  let timerInterval = null;
  let multiplicadorActual = 1;

  const timerEl = document.getElementById('timer');
  const timerLabel = document.getElementById('timerLabel');
  const barraMinarEl = document.getElementById('barraMinar');
  const btnMinar = document.getElementById('btnMinar');
  const pozoEl = document.getElementById('pozo');
  const anilloFill = document.getElementById('anilloFill');
  const progresoTexto = document.getElementById('progresoTexto');

  const CIRCUNFERENCIA = 2 * Math.PI * 85;

  function actualizarTimer() {
    if (totalSeconds <= 0) {
      timerEl.textContent = '✅ LISTO';
      timerLabel.textContent = '¡PUEDES MINAR AHORA!';
      barraMinarEl.style.width = '100%';
      btnMinar.disabled = false;
      if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
      return;
    }
    const h = String(Math.floor(totalSeconds / 3600)).padStart(2, '0');
    const m = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, '0');
    const s = String(totalSeconds % 60).padStart(2, '0');
    timerEl.textContent = h + ':' + m + ':' + s;
    const totalDia = 24 * 60 * 60;
    const pct = ((totalDia - totalSeconds) / totalDia) * 100;
    barraMinarEl.style.width = pct + '%';
    totalSeconds--;
  }

  function arrancarTimer(segundos) {
    if (timerInterval) clearInterval(timerInterval);
    totalSeconds = segundos;
    if (segundos <= 0) {
      timerEl.textContent = '✅ LISTO';
      timerLabel.textContent = '¡PUEDES MINAR AHORA!';
      barraMinarEl.style.width = '100%';
      btnMinar.disabled = false;
      btnMinar.innerHTML = '⛏️ MINAR (+' + (5 * multiplicadorActual) + ' ORO21)';
    } else {
      timerLabel.textContent = 'PRÓXIMA MINERÍA DISPONIBLE';
      btnMinar.disabled = true;
      btnMinar.innerHTML = '⛏️ MINAR';
      actualizarTimer();
      timerInterval = setInterval(actualizarTimer, 1000);
    }
  }

  function calcularFaseActual(users) {
    if (users === 0) return 0;
    for (let i = 0; i < FASES.length; i++) {
      const f = FASES[i];
      if (f.cap === null) return i;
      if (users >= f.from && users <= f.to) return i;
    }
    return FASES.length - 1;
  }

  function progresoFase(fase, users) {
    if (fase.cap === null) return 100;
    const done = Math.max(0, users - fase.from + 1);
    return Math.min(100, (done / fase.cap) * 100);
  }

  function renderPozo() {
    const faseActualIdx = calcularFaseActual(USUARIOS);
    pozoEl.innerHTML = '';

    if (faseActualIdx === 5) {
      const div = document.createElement('div');
      div.className = 'fase6-infinito';
      div.innerHTML =
        '<div class="infinito-simbolo">∞</div>' +
        '<div class="infinito-texto">FASE 6 · ABIERTA</div>' +
        '<div class="infinito-contador">👥 ' + USUARIOS.toLocaleString() + ' usuarios minando</div>' +
        '<div class="infinito-minero">👷‍♂️⛏️</div>';
      pozoEl.appendChild(div);
      return;
    }

    FASES.forEach((fase, i) => {
      let estado = 'bloqueada';
      if (i < faseActualIdx) estado = 'completada';
      else if (i === faseActualIdx) estado = 'activa';

      if (estado === 'completada') return;

      const pct = progresoFase(fase, USUARIOS);
      let contador = '';
      const dentro = Math.max(0, Math.min(USUARIOS - fase.from + 1, fase.cap));
      contador = '👥 ' + dentro.toLocaleString() + ' / ' + fase.cap.toLocaleString();

      let badge = '';
      if (estado === 'activa') badge = '⛏️ EN PROGRESO';
      else badge = '🔒 BLOQUEADA';

      const div = document.createElement('div');
      div.className = 'fase ' + estado;
      div.setAttribute('data-fase', i);

      let html = '<div class="fase-izq">';
      html += '<div class="fase-nombre">' + fase.nombre + '</div>';
      html += '<div class="fase-reward">🪙 ' + fase.reward + ' ORO21</div>';
      html += '<div class="fase-contador">' + contador + '</div>';
      html += '<div class="fase-barra"><div class="fase-barra-fill" style="width:' + pct + '%"></div></div>';
      html += '</div>';
      html += '<div class="fase-badge">' + badge + '</div>';

      if (estado === 'activa') {
        html += '<div class="minero">👷‍♂️</div>';
      }

      div.innerHTML = html;
      pozoEl.appendChild(div);
    });
  }

  function renderAnillo() {
    const maxUsuarios = 21000;
    const pct = Math.min(100, (USUARIOS / maxUsuarios) * 100);
    const offset = CIRCUNFERENCIA - (pct / 100) * CIRCUNFERENCIA;
