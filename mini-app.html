<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>OUROBORO21 · Miner</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: radial-gradient(circle at 50% 30%, #1a1200 0%, #000 80%);
    color: #f5d76e;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 15px;
    overflow-x: hidden;
  }
  header { text-align: center; margin-bottom: 10px; }
  header h1 {
    font-size: 24px;
    letter-spacing: 3px;
    background: linear-gradient(180deg, #fff2b0, #d4a017, #8b6914);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 900;
  }
  header p { font-size: 10px; color: #a08030; letter-spacing: 1px; margin-top: 3px; }
  .user-info {
    font-size: 11px;
    color: #a08030;
    background: rgba(245, 215, 110, 0.08);
    border: 1px solid #3a2a08;
    border-radius: 20px;
    padding: 5px 14px;
    margin-bottom: 12px;
    letter-spacing: 1px;
  }
  .panel-saldos {
    width: 100%;
    max-width: 340px;
    background: linear-gradient(135deg, rgba(245,215,110,0.06), rgba(245,215,110,0.02));
    border: 1px solid #3a2a08;
    border-radius: 14px;
    padding: 12px;
    margin-bottom: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  .saldos-lista {
    display: flex;
    flex-direction: column;
    gap: 5px;
    flex: 1;
  }
  .saldo-fila {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    letter-spacing: 0.5px;
  }
  .saldo-label { color: #a08030; }
  .saldo-valor { color: #f5d76e; font-weight: bold; }
  .saldo-valor.destacado { color: #fff2b0; text-shadow: 0 0 8px rgba(245,215,110,0.6); }
  .btn-retirar-panel {
    padding: 10px 14px;
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 1px;
    color: #1a1200;
    background: linear-gradient(180deg, #fff2b0, #d4a017);
    border: none;
    border-radius: 12px;
    cursor: pointer;
    box-shadow: 0 3px 10px rgba(245, 215, 110, 0.4);
    white-space: nowrap;
  }
  .btn-retirar-panel:active { transform: scale(0.95); }
  .coin-container {
    width: 170px;
    height: 170px;
    perspective: 1000px;
    margin: 10px 0 15px;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .coin {
    width: 100%;
    height: 100%;
    object-fit: contain;
    animation: girar 4s linear infinite;
    filter: drop-shadow(0 0 25px rgba(245, 215, 110, 0.6));
  }
  @keyframes girar {
    0%   { transform: rotateY(0deg); }
    100% { transform: rotateY(360deg); }
  }
  .timer {
    font-size: 28px;
    font-weight: bold;
    color: #f5d76e;
    text-shadow: 0 0 15px rgba(245, 215, 110, 0.7);
    margin: 5px 0;
    letter-spacing: 2px;
  }
  .timer-label {
    font-size: 10px;
    color: #a08030;
    letter-spacing: 1px;
    margin-bottom: 10px;
  }
  .progress-bar {
    width: 100%;
    max-width: 300px;
    height: 8px;
    background: #221a05;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid #3a2a08;
    margin-bottom: 8px;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #8b6914, #f5d76e, #fff2b0);
    transition: width 1s linear;
    box-shadow: 0 0 12px rgba(245, 215, 110, 0.8);
  }
  .progress-text {
    font-size: 10px;
    color: #a08030;
    margin-bottom: 20px;
  }
  .btn-claim {
    padding: 15px 50px;
    font-size: 16px;
    font-weight: bold;
    letter-spacing: 2px;
    color: #1a1200;
    background: linear-gradient(180deg, #fff2b0, #d4a017);
    border: none;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 5px 20px rgba(245, 215, 110, 0.5);
    transition: transform 0.15s;
    margin-bottom: 12px;
  }
  .btn-claim:active { transform: scale(0.95); }
  .btn-claim:disabled {
    background: #3a2a08;
    color: #6a5020;
    box-shadow: none;
    cursor: not-allowed;
  }
  .btn-jugar {
    padding: 12px 40px;
    font-size: 14px;
    font-weight: bold;
    letter-spacing: 2px;
    color: #f5d76e;
    background: transparent;
    border: 1px solid #4a3510;
    border-radius: 50px;
    cursor: pointer;
    margin-bottom: 20px;
    transition: background 0.2s, border 0.2s;
  }
  .btn-jugar:active { background: #2a1e05; border-color: #f5d76e; }
  footer {
    margin-top: 15px;
    font-size: 10px;
    color: #6a5020;
    text-align: center;
    letter-spacing: 1px;
  }
  .modal {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.85);
    display: none;
    justify-content: center;
    align-items: center;
    padding: 20px;
    z-index: 1000;
  }
  .modal.active { display: flex; }
  .modal-content {
    background: linear-gradient(180deg, #1a1200, #0a0800);
    border: 1px solid #4a3510;
    border-radius: 20px;
    padding: 25px 20px;
    max-width: 340px;
    width: 100%;
    text-align: center;
    box-shadow: 0 0 40px rgba(245, 215, 110, 0.3);
  }
  .modal-content h2 {
    color: #f5d76e;
    font-size: 18px;
    margin-bottom: 12px;
    letter-spacing: 2px;
  }
  .modal-content p {
    color: #c9a94a;
    font-size: 14px;
    line-height: 1.5;
    margin-bottom: 20px;
    white-space: pre-line;
  }
  .modal-content button {
    padding: 12px 35px;
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 2px;
    color: #1a1200;
    background: linear-gradient(180deg, #fff2b0, #d4a017);
    border: none;
    border-radius: 50px;
    cursor: pointer;
  }
  .loading {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid #1a1200;
    border-top: 2px solid transparent;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-left: 8px;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

  <header>
    <h1>OUROBORO21</h1>
    <p>El ciclo eterno del valor en la red TON</p>
  </header>

  <div class="user-info" id="userInfo">Cargando usuario...</div>

  <div class="panel-saldos">
    <div class="saldos-lista">
      <div class="saldo-fila">
        <span class="saldo-label">Total:</span>
        <span class="saldo-valor" id="saldoTotal">— ORO21</span>
      </div>
      <div class="saldo-fila">
        <span class="saldo-label">Retirado:</span>
        <span class="saldo-valor" id="saldoRetirado">— ORO21</span>
      </div>
      <div class="saldo-fila">
        <span class="saldo-label">Disponible:</span>
        <span class="saldo-valor destacado" id="saldoDisponible">— ORO21</span>
      </div>
    </div>
    <button class="btn-retirar-panel" onclick="solicitarRetiro()">💸<br>RETIRAR</button>
  </div>

  <div class="coin-container">
    <img class="coin" src="logo.png" alt="ORO21">
  </div>

  <div class="timer" id="timer">--:--:--</div>
  <div class="timer-label" id="timerLabel">Cargando estado...</div>

  <div class="progress-bar">
    <div class="progress-fill" id="progress"></div>
  </div>
  <div class="progress-text" id="progress-text">—</div>

  <button class="btn-claim" id="btnClaim" disabled>⛏️ MINAR</button>

  <button class="btn-jugar" onclick="mostrarProximamente()">🎰 JUGAR</button>

  <footer>
    $ORO21 · TON · 21.000.000 suministro fijo
  </footer>

  <div class="modal" id="modal">
    <div class="modal-content">
      <h2 id="modalTitle">Resultado</h2>
      <p id="modalText">Cargando...</p>
      <button onclick="cerrarModal()">CERRAR</button>
    </div>
  </div>

<script>
  const WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbymAsRtFWseGmRCYOlWjtTD_Prmr8zPis9zGzVu9b2ILjNjvcB-d84GoV6HAgPbv_Hy/exec";

  const tg = window.Telegram?.WebApp;
  let usuarioActual = null;

  if (tg) {
    tg.ready();
    tg.expand();
    const user = tg.initDataUnsafe?.user;
    if (user) {
      usuarioActual = {
        id: user.id,
        username: user.username || '',
        nombre: (user.first_name || '') + ' ' + (user.last_name || '')
      };
      document.getElementById('userInfo').textContent =
        '👤 ' + (usuarioActual.username ? '@' + usuarioActual.username : usuarioActual.nombre.trim());
    } else {
      document.getElementById('userInfo').textContent = '⚠️ Abre desde Telegram';
    }
  } else {
    usuarioActual = { id: 123456789, username: 'prueba', nombre: 'Usuario Prueba' };
    document.getElementById('userInfo').textContent = '🧪 Modo prueba (navegador)';
  }

  let totalSeconds = 0;
  let timerInterval = null;
  const timerEl = document.getElementById('timer');
  const timerLabel = document.getElementById('timerLabel');
  const progressEl = document.getElementById('progress');
  const progressText = document.getElementById('progress-text');
  const btnClaim = document.getElementById('btnClaim');

  function actualizarTimer() {
    if (totalSeconds <= 0) {
      timerEl.textContent = '✅ LISTO';
      timerLabel.textContent = '¡PUEDES MINAR AHORA!';
      progressEl.style.width = '100%';
      progressText.textContent = '100% completado';
      btnClaim.disabled = false;
      if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
      return;
    }
    const h = String(Math.floor(totalSeconds / 3600)).padStart(2, '0');
    const m = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, '0');
    const s = String(totalSeconds % 60).padStart(2, '0');
    timerEl.textContent = h + ':' + m + ':' + s;
    const segundosEn24h = 24 * 60 * 60;
    const progreso = ((segundosEn24h - totalSeconds) / segundosEn24h) * 100;
    progressEl.style.width = progreso + '%';
    progressText.textContent = progreso.toFixed(1) + '% completado';
    totalSeconds--;
  }

  function arrancarTimer(segundos) {
    if (timerInterval) clearInterval(timerInterval);
    totalSeconds = segundos;
    if (segundos <= 0) {
      timerEl.textContent = '✅ LISTO';
      timerLabel.textContent = '¡PUEDES MINAR AHORA!';
      progressEl.style.width = '100%';
      progressText.textContent = '100% completado';
      btnClaim.disabled = false;
      btnClaim.innerHTML = '⛏️ MINAR';
      btnClaim.onclick = null;
    } else {
      timerLabel.textContent = 'PRÓXIMA MINERÍA DISPONIBLE';
      btnClaim.disabled = true;
      btnClaim.innerHTML = '⛏️ MINAR';
      actualizarTimer();
      timerInterval = setInterval(actualizarTimer, 1000);
    }
  }

  async function actualizarPanelSaldos() {
    const res = await llamarWebhook('saldo', {}, true);
    if (!res || !res.mensaje) {
      document.getElementById('saldoTotal').textContent = '— ORO21';
      document.getElementById('saldoRetirado').textContent = '— ORO21';
      document.getElementById('saldoDisponible').textContent = '— ORO21';
      return;
    }
    const texto = res.mensaje;
    const matchTotal = texto.match(/Total acumulado:\s*([\d.-]+)/);
    const matchRetirado = texto.match(/Ya retirado:\s*([\d.-]+)/);
    const matchDisponible = texto.match(/Disponible:\s*([\d.-]+)/);
    if (matchTotal) document.getElementById('saldoTotal').textContent = matchTotal[1] + ' ORO21';
    if (matchRetirado) document.getElementById('saldoRetirado').textContent = matchRetirado[1] + ' ORO21';
    if (matchDisponible) document.getElementById('saldoDisponible').textContent = matchDisponible[1] + ' ORO21';
    if (!matchTotal && !matchRetirado && !matchDisponible) {
      document.getElementById('saldoTotal').textContent = '— ORO21';
      document.getElementById('saldoRetirado').textContent = '— ORO21';
      document.getElementById('saldoDisponible').textContent = '— ORO21';
    }
  }

  async function cargarEstadoInicial() {
    timerLabel.textContent = 'Conectando con el servidor...';

    let res = await llamarWebhook('estado', {}, true);

    if (!res || !res.estado) {
      timerEl.textContent = '--:--:--';
      timerLabel.textContent = 'Reintentando conexion...';
      res = await llamarWebhook('estado', {}, true);
    }

    if (!res || !res.estado) {
      timerEl.textContent = '--:--:--';
      timerLabel.textContent = 'Error al cargar';
      return;
    }

    const est = res.estado;

    if (!est.registrado) {
      timerEl.textContent = '❌';
      timerLabel.textContent = 'REGÍSTRATE PRIMERO';
      progressText.textContent = '—';
      progressEl.style.width = '0%';
      btnClaim.disabled = false;
      btnClaim.textContent = '📝 REGISTRARSE EN EL BOT';
      btnClaim.onclick = function() {
        mostrarModal('📝 Regístrate en el bot',
          'Ve al bot y escribe /registro para registrarte paso a paso.');
      };
      await actualizarPanelSaldos();
      return;
    }

    if (est.puedeMinar) {
      arrancarTimer(0);
    } else {
      arrancarTimer(est.segundosRestantes);
    }

    await actualizarPanelSaldos();
  }

  function llamarWebhook(accion, datos = {}, silencioso = false) {
    return new Promise((resolve) => {
      if (!usuarioActual) {
        if (!silencioso) mostrarModal('Error', 'No se pudo identificar al usuario.');
        resolve(null);
        return;
      }
      const payload = {
        accion: accion,
        userId: usuarioActual.id,
        username: usuarioActual.username,
        ...datos
      };
      const callbackName = 'jsonpCallback_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
      const url = WEBHOOK_URL + "?payload=" + encodeURIComponent(JSON.stringify(payload)) + "&callback=" + callbackName;
      let finalizado = false;
      const timeoutId = setTimeout(() => {
        if (finalizado) return;
        finalizado = true;
        cleanup();
        if (!silencioso) mostrarModal('⚠️ Error', 'Tiempo de espera agotado');
        resolve(null);
      }, 35000);
      function cleanup() {
        clearTimeout(timeoutId);
        try { delete window[callbackName]; } catch(e) {}
        if (scriptElement && scriptElement.parentNode) {
          scriptElement.parentNode.removeChild(scriptElement);
        }
      }
      window[callbackName] = function(data) {
        if (finalizado) return;
        finalizado = true;
        cleanup();
        resolve(data);
      };
      const scriptElement = document.createElement('script');
      scriptElement.src = url;
      scriptElement.onerror = function() {
        if (finalizado) return;
        finalizado = true;
        cleanup();
        if (!silencioso) mostrarModal('⚠️ Error', 'Error de conexión');
        resolve(null);
      };
      document.body.appendChild(scriptElement);
    });
  }

  async function minar() {
    btnClaim.disabled = true;
    btnClaim.innerHTML = 'Minando...<span class="loading"></span>';
    const res = await llamarWebhook('minar');
    if (res && res.ok) {
      mostrarModal('⛏️ Minería', res.mensaje || 'Has minado 5 ORO21');
      arrancarTimer(24 * 60 * 60);
      actualizarPanelSaldos();
    } else {
      mostrarModal('⚠️ Aviso', res && res.mensaje ? res.mensaje : 'No se pudo minar');
      cargarEstadoInicial();
    }
  }

  btnClaim.addEventListener('click', function() {
    if (!this.onclick || this.onclick === null) { minar(); }
  });

  async function solicitarRetiro() {
    const cantidad = prompt('¿Cuántos ORO21 deseas retirar?\n(Mínimo: 100)');
    if (!cantidad) return;
    const cant = parseInt(cantidad);
    if (isNaN(cant) || cant < 100) {
      mostrarModal('⚠️ Error', 'Cantidad inválida. Mínimo 100 ORO21.');
      return;
    }
    mostrarModal('💸 Procesando...', 'Enviando solicitud...');
    const res = await llamarWebhook('retirar', { cantidad: cant });
    mostrarModal('💸 Retiro', res && res.mensaje ? res.mensaje : 'Solicitud enviada');
    actualizarPanelSaldos();
  }

  function mostrarProximamente() {
    mostrarModal('🎰 Juegos', 'Próximamente...\n\nEstamos trabajando en nuevos juegos para que ganes más ORO21.');
  }

  function mostrarModal(titulo, texto) {
    document.getElementById('modalTitle').textContent = titulo;
    document.getElementById('modalText').textContent = texto;
    document.getElementById('modal').classList.add('active');
  }

  function cerrarModal() {
    document.getElementById('modal').classList.remove('active');
  }

  window.addEventListener('load', () => {
    setTimeout(cargarEstadoInicial, 500);
  });
</script>

</body>
</html>
