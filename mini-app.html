<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OUROBORO21 · Miner</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: radial-gradient(circle at 50% 30%, #1a1200 0%, #000 80%);
    color: #f5d76e;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    overflow-x: hidden;
  }

  header {
    text-align: center;
    margin-bottom: 20px;
  }
  header h1 {
    font-size: 28px;
    letter-spacing: 3px;
    background: linear-gradient(180deg, #fff2b0, #d4a017, #8b6914);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 900;
  }
  header p {
    font-size: 12px;
    color: #a08030;
    letter-spacing: 1px;
    margin-top: 4px;
  }

  .coin-container {
    width: 240px;
    height: 240px;
    perspective: 1000px;
    margin: 30px 0;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .coin {
    width: 100%;
    height: 100%;
    object-fit: contain;
    animation: girar 4s linear infinite;
    filter: drop-shadow(0 0 25px rgba(245, 215, 110, 0.6));
  }
  @keyframes girar {
    0%   { transform: rotateY(0deg); }
    100% { transform: rotateY(360deg); }
  }

  .timer {
    font-size: 32px;
    font-weight: bold;
    color: #f5d76e;
    text-shadow: 0 0 15px rgba(245, 215, 110, 0.7);
    margin: 10px 0;
    letter-spacing: 2px;
  }
  .timer-label {
    font-size: 12px;
    color: #a08030;
    letter-spacing: 1px;
    margin-bottom: 20px;
  }

  .progress-bar {
    width: 100%;
    max-width: 320px;
    height: 10px;
    background: #221a05;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid #3a2a08;
    margin-bottom: 10px;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #8b6914, #f5d76e, #fff2b0);
    transition: width 1s linear;
    box-shadow: 0 0 12px rgba(245, 215, 110, 0.8);
  }
  .progress-text {
    font-size: 12px;
    color: #a08030;
    margin-bottom: 25px;
  }

  .btn-claim {
    padding: 15px 50px;
    font-size: 16px;
    font-weight: bold;
    letter-spacing: 2px;
    color: #1a1200;
    background: linear-gradient(180deg, #fff2b0, #d4a017);
    border: none;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 5px 20px rgba(245, 215, 110, 0.5);
    transition: transform 0.15s, box-shadow 0.15s;
    margin-bottom: 30px;
  }
  .btn-claim:active {
    transform: scale(0.95);
    box-shadow: 0 2px 10px rgba(245, 215, 110, 0.8);
  }
  .btn-claim:disabled {
    background: #3a2a08;
    color: #6a5020;
    box-shadow: none;
    cursor: not-allowed;
  }

  .menu {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    width: 100%;
    max-width: 320px;
  }
  .menu button {
    padding: 14px;
    font-size: 13px;
    font-weight: bold;
    color: #f5d76e;
    background: #1a1200;
    border: 1px solid #4a3510;
    border-radius: 12px;
    cursor: pointer;
    transition: background 0.2s, border 0.2s;
    letter-spacing: 1px;
  }
  .menu button:active {
    background: #2a1e05;
    border-color: #f5d76e;
  }

  footer {
    margin-top: 30px;
    font-size: 11px;
    color: #6a5020;
    text-align: center;
    letter-spacing: 1px;
  }
</style>
</head>
<body>

  <header>
    <h1>OUROBORO21</h1>
    <p>El ciclo eterno del valor en la red TON</p>
  </header>

  <div class="coin-container">
    <img class="coin" src="logo.png" alt="ORO21">
  </div>

  <div class="timer" id="timer">24:00:00</div>
  <div class="timer-label">PRÓXIMA MINERÍA DISPONIBLE</div>

  <div class="progress-bar">
    <div class="progress-fill" id="progress"></div>
  </div>
  <div class="progress-text" id="progress-text">0% completado</div>

  <button class="btn-claim" id="btnClaim">⛏️ MINAR</button>

  <div class="menu">
    <button>💰 Saldo</button>
    <button>💸 Retirar</button>
    <button>📋 Mis Retiros</button>
    <button>📝 Registro</button>
    <button>📊 Stats</button>
    <button>❓ Ayuda</button>
  </div>

  <footer>
    $ORO21 · TON · 21.000.000 suministro fijo
  </footer>

<script>
  // Temporizador 24h (solo visual por ahora)
  let totalSeconds = 24 * 60 * 60;
  const timerEl = document.getElementById('timer');
  const progressEl = document.getElementById('progress');
  const progressText = document.getElementById('progress-text');
  const btnClaim = document.getElementById('btnClaim');

  function actualizar() {
    const h = String(Math.floor(totalSeconds / 3600)).padStart(2, '0');
    const m = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, '0');
    const s = String(totalSeconds % 60).padStart(2, '0');
    timerEl.textContent = `${h}:${m}:${s}`;

    const progreso = ((24 * 3600 - totalSeconds) / (24 * 3600)) * 100;
    progressEl.style.width = progreso + '%';
    progressText.textContent = progreso.toFixed(1) + '% completado';

    if (totalSeconds > 0) {
      totalSeconds--;
    } else {
      btnClaim.disabled = false;
      timerEl.textContent = '¡LISTO!';
    }
  }

  btnClaim.disabled = true;
  setInterval(actualizar, 1000);
  actualizar();

  // Simulación de minado (para probar el diseño)
  btnClaim.addEventListener('click', () => {
    btnClaim.disabled = true;
    totalSeconds = 24 * 60 * 60;
    alert('⛏️ Minería registrada (demo)');
  });
</script>

</body>
</html>
